
<!doctype html>

    <script>
        function unwrapGift() {
            document.getElementById('gift').textContent = '💝';

            document.getElementById('giftText').textContent =
                'Keji, this gift is a little reminder that you are loved, cherished, and appreciated more than words can say. Today, tomorrow, and every day—you deserve beautiful things. 💗';
